name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Generated refs are up to date
        run: |
          npm run build
          git diff --exit-code -- refs-data.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke, design floor and accessibility tests
        run: npm test
        env:
          CI: "1"

      - name: Whitespace check
        run: git diff --check
