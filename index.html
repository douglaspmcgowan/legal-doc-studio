<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recital — Legal Document Studio</title>
    <meta
      name="description"
      content="Interactive legal-document studio: fill, edit, and trace every citation in a Motion to Dismiss."
    />
    <meta name="theme-color" content="#eef0f2" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Recital: legal document studio" />
    <meta
      property="og:description"
      content="Fill, edit, and trace every citation in a Motion to Dismiss."
    />
    <meta property="og:image" content="og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b1d24' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 20l10 0'/%3E%3Cpath d='M6 6l6 -1l6 1'/%3E%3Cpath d='M12 3l0 17'/%3E%3Cpath d='M9 12l-3 -6l-3 6a3 3 0 0 0 6 0'/%3E%3Cpath d='M21 12l-3 -6l-3 6a3 3 0 0 0 6 0'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Icons: Tabler Icons 3.49.0 (MIT), https://tabler.io/icons -->
    <div class="app">
      <!-- header -->
      <header class="topbar">
        <div class="brand">
          <svg
            class="brand__mark"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--oxblood)"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 20l10 0" />
            <path d="M6 6l6 -1l6 1" />
            <path d="M12 3l0 17" />
            <path d="M9 12l-3 -6l-3 6a3 3 0 0 0 6 0" />
            <path d="M21 12l-3 -6l-3 6a3 3 0 0 0 6 0" />
          </svg>
          <span class="brand__name">Recital</span>
        </div>

        <div class="topbar__drawers">
          <button
            class="btn btn--tonal drawer-toggle"
            id="btnFields"
            type="button"
            aria-expanded="false"
            aria-controls="rail"
          >
            <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3a3 3 0 0 0 -3 3v12a3 3 0 0 0 3 3" /><path d="M6 3a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3" /><path d="M13 7h7a1 1 0 0 1 1 1v8a1 1 0 0 1 -1 1h-7" /><path d="M5 7h-1a1 1 0 0 0 -1 1v8a1 1 0 0 0 1 1h1" /><path d="M17 12h.01" /><path d="M13 12h.01" />
          </svg>
            <span class="btn__label">Fields</span>
          </button>
          <button
            class="btn btn--tonal drawer-toggle"
            id="btnAuthorities"
            type="button"
            aria-expanded="false"
            aria-controls="ctx"
          >
            <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13 5h8" /><path d="M13 9h5" /><path d="M13 15h8" /><path d="M13 19h5" /><path d="M3 4m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" /><path d="M3 14m0 1a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" />
          </svg>
            <span class="btn__label">Authorities</span>
          </button>
        </div>

        <div class="topbar__spacer"></div>

        <div
          class="progress"
          id="progress"
          role="progressbar"
          aria-label="Fields completed"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress__track">
            <div class="progress__fill" id="progFill"></div>
          </div>
          <span class="progress__txt" id="progTxt">0 / 0 fields</span>
        </div>

        <div class="segmented" role="group" aria-label="View mode">
          <button data-mode="fill" aria-pressed="true">Fill</button>
          <button data-mode="read" aria-pressed="false">Read</button>
          <button data-mode="edit" aria-pressed="false">Edit</button>
        </div>

        <button class="btn btn--primary" id="btnPrint" title="Print or save as PDF">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M17 17h2a2 2 0 0 0 2 -2v-4a2 2 0 0 0 -2 -2h-14a2 2 0 0 0 -2 2v4a2 2 0 0 0 2 2h2" />
            <path d="M17 9v-4a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v4" />
            <path d="M7 15a2 2 0 0 1 2 -2h6a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2l0 -4" />
          </svg>
          <span class="btn__label">Print / PDF</span>
        </button>
      </header>

      <!-- body -->
      <div class="workbench">
        <!-- left: fill-in form -->
        <aside class="rail" id="rail" aria-label="Document fields">
          <div class="rail__head">
            <button
              class="iconbtn drawer-close"
              type="button"
              data-close-drawer
              aria-label="Close fields"
            >
              <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6l-12 12" /><path d="M6 6l12 12" />
          </svg>
            </button>
            <h2 class="rail__title">Fill in the document</h2>
            <p class="rail__sub">
              Highlighted blanks update everywhere they appear.
            </p>
            <div class="rail__actions">
              <button class="btn btn--tonal" id="btnSample">Use sample data</button>
              <button class="btn btn--text" id="btnClear">Clear</button>
            </div>
          </div>
          <div class="form" id="form"></div>
        </aside>

        <!-- center: the document -->
        <main class="stage" id="stage" aria-label="Document">
          <header class="doc-title">
            <h1 class="doc-title__h" id="docTitle">Motion to Dismiss</h1>
            <p class="doc-title__sub" id="docSub">E.D. Pa., FRCP 12(b)(6)</p>
          </header>
          <article class="paper" id="paper"></article>
        </main>

        <!-- right: context / authorities / sources -->
        <aside class="ctx" id="ctx" aria-label="Citations and sources">
          <div class="ctx__top">
          <div class="ctx__tabs" role="tablist">
            <button
              class="ctx__tab"
              id="ctxTab-context"
              role="tab"
              aria-selected="true"
              aria-controls="ctxBody"
              data-tab="context"
            >
              Context
            </button>
            <button
              class="ctx__tab"
              id="ctxTab-authorities"
              role="tab"
              aria-selected="false"
              aria-controls="ctxBody"
              data-tab="authorities"
            >
              Authorities
            </button>
            <button
              class="ctx__tab"
              id="ctxTab-sources"
              role="tab"
              aria-selected="false"
              aria-controls="ctxBody"
              data-tab="sources"
            >
              Sources
            </button>
          </div>
            <button
              class="iconbtn drawer-close"
              type="button"
              data-close-drawer
              aria-label="Close authorities"
            >
              <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6l-12 12" /><path d="M6 6l12 12" />
          </svg>
            </button>
          </div>
          <div
            class="ctx__body"
            id="ctxBody"
            role="tabpanel"
            tabindex="0"
            aria-labelledby="ctxTab-context"
          ></div>
        </aside>
      </div>
    </div>

    <!-- scrim behind the form and context drawers (below 1080px) -->
    <div class="scrim scrim--rails" id="railScrim"></div>

    <!-- reference reader drawer -->
    <div class="scrim" id="scrim"></div>
    <div
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-label="Reference document"
    >
      <div class="drawer__head">
        <h3 id="drawerTitle">Reference</h3>
        <button class="iconbtn" id="drawerClose" aria-label="Close">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6l-12 12" />
            <path d="M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="drawer__body"><div class="md" id="drawerBody"></div></div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="refs-data.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
